<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Accedi · Operations Engine</title><link rel="stylesheet" href="./assets/css/base.css"><link rel="stylesheet" href="./assets/css/auth.css?v=4"></head>
<body><main class="auth-page"><section class="auth-card" aria-labelledby="loginTitle">
  <p class="eyebrow">Operations Engine</p><h1 id="loginTitle">Accedi</h1>
  <p>Area operativa protetta.</p>
  <form id="loginForm" class="auth-form"><label>Email<input name="email" type="email" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <label class="auth-remember"><input name="remember" type="checkbox"> Ricordami su questo dispositivo</label>
    <button type="submit">Accedi</button><p id="loginMessage" class="auth-message" role="status" aria-live="polite"></p></form>
  <div class="auth-divider" aria-hidden="true"><span>oppure</span></div>
  <div class="auth-register-cta"><p><strong>Non hai ancora un'organizzazione?</strong><br><span>Crea lo spazio operativo della tua azienda.</span></p>
    <a class="button auth-secondary-button" href="./register.html">Crea organizzazione · Private Beta</a></div>
</section></main><script type="module" src="./assets/js/auth/login.js?v=2"></script></body></html>
