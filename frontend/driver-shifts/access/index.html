<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>I tuoi turni · Operations Engine</title>
    <link rel="stylesheet" href="/app/assets/css/driver-shifts-access.css?v=1" />
  </head>
  <body>
    <main class="driver-shifts-access-shell">
      <section id="driverShiftsAccessLoading" class="driver-shifts-access-card" aria-live="polite">
        <span class="driver-shifts-access-mark" aria-hidden="true">OE</span>
        <p>Verifica accesso in corso…</p>
      </section>

      <section id="driverShiftsAccessContent" class="driver-shifts-access-card" hidden>
        <span class="driver-shifts-access-mark" aria-hidden="true">OE</span>
        <p class="eyebrow">Operations Engine</p>
        <h1>I tuoi turni</h1>
        <p class="driver-shifts-access-lead">Accedi per consultare la tua settimana di lavoro.</p>
        <p>L’accesso personale sarà richiesto nel passaggio successivo.</p>
      </section>

      <section id="driverShiftsAccessError" class="driver-shifts-access-card" hidden>
        <span class="driver-shifts-access-mark" aria-hidden="true">OE</span>
        <h1>Link non disponibile</h1>
        <p>Il collegamento non è valido oppure non è più attivo.</p>
      </section>
    </main>
    <script type="module" src="/app/assets/js/driver-shifts-access.js?v=1"></script>
  </body>
</html>
